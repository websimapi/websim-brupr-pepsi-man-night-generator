<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepsi Man Night Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .generator-section {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 40px;
            text-align: center;
        }

        .prompt-text {
            font-size: 1.8rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .input-container {
            margin: 20px 0;
        }

        .blank-input {
            font-size: 1.5rem;
            padding: 15px 20px;
            border: none;
            border-radius: 15px;
            text-align: center;
            min-width: 200px;
            max-width: 90%;
            background: rgba(255,255,255,0.9);
            color: #333;
        }

        .generate-btn {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .generate-btn:hover {
            transform: translateY(-2px);
        }

        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            margin: 20px 0;
            font-size: 1.1rem;
        }

        .gallery-section {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
        }

        .gallery-title {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 30px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .creation-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .creation-card:hover {
            transform: translateY(-5px);
        }

        .creation-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .creation-info {
            padding: 15px;
        }

        .creation-text {
            font-size: 1.1rem;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .creation-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2rem;
            }
            
            .prompt-text {
                font-size: 1.4rem;
            }
            
            .blank-input {
                font-size: 1.2rem;
                min-width: 150px;
            }
            
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Initialize WebsimSocket
        const room = new WebsimSocket();

        function App() {
            const [blankText, setBlankText] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [creations, setCreations] = useState([]);

            // Subscribe to creations from database
            const dbCreations = React.useSyncExternalStore(
                room.collection('pepsi_creation').subscribe,
                room.collection('pepsi_creation').getList
            );

            useEffect(() => {
                // Reverse to show newest first
                setCreations([...dbCreations].reverse());
            }, [dbCreations]);

            const generateImage = async () => {
                if (!blankText.trim()) {
                    alert('Please fill in the blank!');
                    return;
                }

                setIsGenerating(true);
                try {
                    const prompt = `Pepsi man eating coca-cola on a ${blankText.trim()} night`;
                    
                    // Generate image using LLM
                    const result = await websim.imageGen({
                        prompt: prompt,
                        aspect_ratio: "16:9"
                    });

                    // Save to database
                    await room.collection('pepsi_creation').create({
                        prompt_text: blankText.trim(),
                        full_prompt: prompt,
                        image_url: result.url
                    });

                    // Clear input
                    setBlankText('');
                } catch (error) {
                    console.error('Error generating image:', error);
                    alert('Failed to generate image. Please try again.');
                } finally {
                    setIsGenerating(false);
                }
            };

            const formatDate = (dateString) => {
                return new Date(dateString).toLocaleDateString();
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1 className="title">🥤 Pepsi Man Night Generator 🌙</h1>
                        <p className="subtitle">Fill in the blank and create unique AI-generated images!</p>
                    </div>

                    <div className="generator-section">
                        <div className="prompt-text">
                            "Pepsi man eating coca-cola on a{' '}
                            <input
                                type="text"
                                className="blank-input"
                                value={blankText}
                                onChange={(e) => setBlankText(e.target.value)}
                                placeholder="magical"
                                maxLength={50}
                                onKeyPress={(e) => e.key === 'Enter' && !isGenerating && generateImage()}
                            />
                            {' '}night"
                        </div>

                        <button
                            className="generate-btn"
                            onClick={generateImage}
                            disabled={isGenerating}
                        >
                            {isGenerating ? '🎨 Generating...' : '✨ Generate Image'}
                        </button>

                        {isGenerating && (
                            <div className="loading">
                                Creating your masterpiece... This may take a moment!
                            </div>
                        )}
                    </div>

                    <div className="gallery-section">
                        <h2 className="gallery-title">🖼️ Community Gallery</h2>
                        
                        {creations.length === 0 ? (
                            <div className="empty-state">
                                <p>No creations yet! Be the first to generate an image.</p>
                            </div>
                        ) : (
                            <div className="gallery-grid">
                                {creations.map((creation) => (
                                    <div key={creation.id} className="creation-card">
                                        <img
                                            src={creation.image_url}
                                            alt={creation.full_prompt}
                                            className="creation-image"
                                            loading="lazy"
                                        />
                                        <div className="creation-info">
                                            <div className="creation-text">
                                                "Pepsi man eating coca-cola on a <strong>{creation.prompt_text}</strong> night"
                                            </div>
                                            <div className="creation-meta">
                                                <div className="user-info">
                                                    <img
                                                        src={`https://images.websim.com/avatar/${creation.username}`}
                                                        alt={creation.username}
                                                        className="user-avatar"
                                                    />
                                                    <span>{creation.username}</span>
                                                </div>
                                                <span>{formatDate(creation.created_at)}</span>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>

</body>
</html>
